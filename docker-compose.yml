services:
  apkmirror-tg-bot:
    build: .
    container_name: apkmirror-tg-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      TZ: ${TZ:-Asia/Shanghai}
      DB_PATH: /data/app.db
      DOWNLOAD_DIR: /data/downloads
      CHECK_HOUR: ${CHECK_HOUR:-9}
      CHECK_MINUTE: ${CHECK_MINUTE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_INIT_OWNER: ${AUTO_INIT_OWNER:-true}
      REQUIRE_SIGNATURE: ${REQUIRE_SIGNATURE:-3891}
      REQUIRE_VARIANT: ${REQUIRE_VARIANT:-bd32}
      PREFER_APK: ${PREFER_APK:-true}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-60}
    volumes:
      - ./data:/data
