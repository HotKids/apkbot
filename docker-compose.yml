services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
    volumes:
      - ./data/bot-api:/var/lib/telegram-bot-api

  apkdl-bot:
    build: .
    container_name: apkdl-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      - telegram-bot-api
